[versions]
smartcoach = "0.2.0-beta.1"

project-minSdk = "29"
project-targetSdk = "36"
project-compileSdk = "36"

agp = "9.0.1"
# The Compose compiler plugin ships with Kotlin; match AGP 9.0.1's built-in Kotlin.
kotlin-compose = "2.2.10"

androidx-core = "1.16.0"
androidx-lifecycle = "2.9.3"
compose = "1.9.0"
compose-material3 = "1.3.2"
androidx-activity-compose = "1.10.1"

[libraries]
smartcoach = { group = "com.pocketradar", name = "smartcoach", version.ref = "smartcoach" }

androidx-core = { group = "androidx.core", name = "core", version.ref = "androidx-core" }
compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "compose" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "compose" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "compose" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "compose" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "compose-material3" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidx-activity-compose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin-compose" }
